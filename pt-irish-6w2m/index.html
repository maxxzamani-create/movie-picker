<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Patsy's">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>Patsy's Irish Pub · BreakShark</title>
<style>
:root{--bg:#07100C;--ink:#F7F2E8;--cop:#4CC07A}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .35s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide>img.bg{position:absolute;inset:0;width:1920px;height:1080px;display:block}
.slide video{position:absolute;object-fit:cover;background:#000}
.tap{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tap span{width:110px;height:110px;border-radius:50%;background:rgba(224,127,82,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.tap span:after{content:"";margin-left:10px;border-left:40px solid #121212;border-top:26px solid transparent;border-bottom:26px solid transparent}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.65),rgba(0,0,0,0));transition:opacity .4s}
#bar.hide{opacity:0}
#bar button{font:600 14px/1 inherit;color:var(--ink);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 14px;cursor:pointer}
#count{font:600 14px/1 inherit;opacity:.85;min-width:54px;text-align:center}
#dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}
#dots i.on{background:var(--cop)}
#notes{position:fixed;left:12px;right:12px;bottom:64px;max-height:38vh;overflow:auto;background:rgba(16,16,18,.96);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.45;display:none}
#notes.show{display:block}#notes b{color:var(--cop);display:block;margin-bottom:6px;font-size:12px;letter-spacing:.12em}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:999px;opacity:.9;transition:opacity 1s}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:9;font-size:15px}
#load .b{width:220px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}#load .b i{display:block;height:100%;width:0;background:var(--cop);transition:width .2s}
</style></head><body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="prev" aria-label="Previous slide">‹ Back</button><span id="count"></span><div id="dots"></div><button id="nbtn">Notes</button><button id="fs">Full screen</button><button id="next" aria-label="Next slide">Next ›</button></div>
<div id="notes"></div>
<div id="hint">Tap the right side or swipe to go forward</div>
<div id="load"><div>Loading the deck…</div><div class="b"><i id="lp"></i></div><div id="lt" style="opacity:.6;font-size:13px"></div></div>
<script>
const SLIDES = [{"img": "s/p-01.jpg", "v": [{"src": "v/room.mp4", "x": 0, "y": 0, "w": 1920, "h": 1080, "r": "0px", "sound": false}], "note": "Let the room play for a second. \"This is your pub, on your own TVs. Every commercial break becomes a Patsy's ad: your tacos, your happy hour, your Thanksgiving Eve party. It costs you nothing in ad money, and we only touch the TVs.\"", "ov": "s/ov-01.png"}, {"img": "s/p-02.jpg", "v": [{"src": "v/s01.mp4", "x": 1080, "y": 300, "w": 720, "h": 405, "r": "14px", "sound": false}], "note": "Walk the five lines, then let the spot play. \"That's what your guests see during a commercial: your happy hour, your prices, your shamrock. Not someone else's ad.\""}, {"img": "s/p-03.jpg", "v": [{"src": "v/how.mp4", "x": 900, "y": 250, "w": 900, "h": 576, "r": "14px", "sound": false}], "note": "\"Here's a real game. When it goes to commercial, the network ad is gone and your spots play: Taco Tuesday, happy hour, football Sundays. When the game comes back, so do your TVs.\" Anything technical, say I'll get you the answer."}, {"img": "s/p-04.jpg", "v": [], "note": "This is straight off their website and menus. Ask if anything changed. Happy hour: the happy hour menu on their site says 3 to 6 daily. Confirm that with the owner."}, {"img": "s/p-05.jpg", "v": [{"src": "v/s02.mp4", "x": 120, "y": 230, "w": 820, "h": 461, "r": "14px", "sound": false}, {"src": "v/s03.mp4", "x": 980, "y": 230, "w": 820, "h": 461, "r": "14px", "sound": false}, {"src": "v/s04.mp4", "x": 120, "y": 720, "w": 500, "h": 281, "r": "14px", "sound": false}, {"src": "v/s07.mp4", "x": 650, "y": 720, "w": 500, "h": 281, "r": "14px", "sound": false}], "note": "These are built from Patsy's own photos, off their own website. Point at the one the owner reacts to: \"That plays during every break.\" Every spot is a draft until they approve it."}, {"img": "s/p-06.jpg", "v": [{"src": "v/s08.mp4", "x": 120, "y": 230, "w": 820, "h": 461, "r": "14px", "sound": false}, {"src": "v/s09.mp4", "x": 980, "y": 230, "w": 820, "h": 461, "r": "14px", "sound": false}, {"src": "v/s05.mp4", "x": 120, "y": 720, "w": 500, "h": 281, "r": "14px", "sound": false}, {"src": "v/s10.mp4", "x": 650, "y": 720, "w": 500, "h": 281, "r": "14px", "sound": false}], "note": "The bar side. The fall cocktail menu runs through November 26, so that spot comes down on the 27th and the holiday spots go up."}, {"img": "s/p-07.jpg", "v": [{"src": "v/s19.mp4", "x": 120, "y": 230, "w": 820, "h": 461, "r": "14px", "sound": false}, {"src": "v/s18.mp4", "x": 980, "y": 230, "w": 820, "h": 461, "r": "14px", "sound": false}, {"src": "v/s12.mp4", "x": 120, "y": 720, "w": 540, "h": 304, "r": "14px", "sound": false}, {"src": "v/s06.mp4", "x": 690, "y": 720, "w": 540, "h": 304, "r": "14px", "sound": false}, {"src": "v/s11.mp4", "x": 1260, "y": 720, "w": 540, "h": 304, "r": "14px", "sound": false}], "note": "The nights that fill the room. Live music leads: the fiddle and the band are their own stage, on their own TVs. The private party spot is the one that can pay for a whole month: partial pub up to 75, whole pub up to 150."}, {"img": "s/p-08.jpg", "v": [{"src": "v/s13.mp4", "x": 860, "y": 150, "w": 460, "h": 259, "r": "14px", "sound": false}, {"src": "v/s14.mp4", "x": 1350, "y": 150, "w": 460, "h": 259, "r": "14px", "sound": false}, {"src": "v/s15.mp4", "x": 860, "y": 440, "w": 460, "h": 259, "r": "14px", "sound": false}, {"src": "v/s16.mp4", "x": 1350, "y": 440, "w": 460, "h": 259, "r": "14px", "sound": false}], "note": "These are the events already on their website. Each one gets its own spot, running on the TVs for the two weeks before. The owner picks which ones to push."}, {"img": "s/p-09.jpg", "v": [{"src": "v/s17b.mp4", "x": 120, "y": 250, "w": 960, "h": 540, "r": "14px", "sound": false}], "note": "St. Patrick's is their Super Bowl: three days, March 15 to 17. Starting the TV spots in late February is how you fill three days, not just one. The band spot runs, then the fiddle: their own live music, on their own TVs."}, {"img": "s/p-10.jpg", "v": [], "note": "This is how the owner knows it worked, from their own numbers: the item sales report their register already prints, plus one question from the staff."}, {"img": "s/p-11.jpg", "v": [], "note": "The Founding 10 offer. Never quote a price or a range: pricing isn't set, and the founding venues help set it. If they ask, say the founding-member rate is something we set together after the 90 days, with no obligation to continue."}, {"img": "s/p-12.jpg", "v": [], "note": "Close on the asks: their list of about six items and events, the item sales reports, and the staff tally. Then book the install."}, {"img": "s/p-13.jpg", "v": [{"src": "v/reel.mp4", "x": 760, "y": 200, "w": 1040, "h": 585, "r": "14px", "sound": true}], "note": "Tap the play button to show the full reel with sound: all 19 spots. Then stop talking and let them react."}];
const stage = document.getElementById('stage'), dots = document.getElementById('dots');
let cur = 0;
SLIDES.forEach((s, i) => {
  const el = document.createElement('div'); el.className = 'slide';
  const im = document.createElement('img'); im.className = 'bg'; im.src = s.img; im.alt = 'Slide ' + (i + 1); el.appendChild(im);
  s.v.forEach(v => {
    const vd = document.createElement('video'); vd.playsInline = true; vd.setAttribute('playsinline', ''); vd.setAttribute('webkit-playsinline', '');
    if (!v.sound) { vd.muted = true; vd.defaultMuted = true; vd.setAttribute('muted', ''); vd.autoplay = false; }
    vd.preload = 'auto'; vd.dataset.src = v.src;
    vd.addEventListener('canplay', () => { if (SLIDES[cur] === s && !vd.dataset.sound && vd.paused) { const p = vd.play(); if (p) p.catch(() => {}); } });
    Object.assign(vd.style, { left: v.x + 'px', top: v.y + 'px', width: v.w + 'px', height: v.h + 'px', borderRadius: v.r });
    if (v.sound) { vd.controls = false; vd.loop = false; vd.muted = false; vd.dataset.sound = 1; vd.style.background = 'transparent'; vd.style.opacity = 0;
      const t = document.createElement('div'); t.className = 'tap'; Object.assign(t.style, { left: v.x + 'px', top: v.y + 'px', width: v.w + 'px', height: v.h + 'px' }); t.innerHTML = '<span></span>';
      t.addEventListener('click', e => { e.stopPropagation(); if (vd.paused) { vd.style.opacity = 1; vd.play(); t.style.display = 'none'; } });
      vd.addEventListener('click', e => { e.stopPropagation(); if (vd.paused) vd.play(); else vd.pause(); });
      vd.addEventListener('ended', () => { t.style.display = 'flex'; vd.style.opacity = 0; vd.currentTime = 0; });
      el.appendChild(vd); el.appendChild(t); s.tap = t;
    } else { vd.muted = true; vd.defaultMuted = true; vd.setAttribute('muted', ''); vd.loop = true; el.appendChild(vd); }
  });
  if (s.ov) { const o = document.createElement('img'); o.src = s.ov; o.alt = ''; o.style.cssText = 'position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none'; el.appendChild(o); }
  stage.appendChild(el); s.el = el;
  const d = document.createElement('i'); d.onclick = e => { e.stopPropagation(); go(i); }; dots.appendChild(d);
});
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'scale(' + k + ')'; }
addEventListener('resize', fit); fit();
function arm(s, on) { s.el.querySelectorAll('video').forEach(v => { if (on && !v.getAttribute('src')) { v.src = v.dataset.src; v.load(); } else if (!on && v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); } }); }
function go(n) {
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  SLIDES.forEach((s, i) => arm(s, Math.abs(i - n) <= 1));
  SLIDES.forEach((s, i) => { const on = i === n; s.el.classList.toggle('on', on);
    s.el.querySelectorAll('video').forEach(v => { if (on && !v.dataset.sound) { v.currentTime = 0; const p = v.play(); if (p) p.catch(() => {}); } else { v.pause(); if (v.dataset.sound) { v.currentTime = 0; v.style.opacity = 0; if (s.tap) s.tap.style.display = 'flex'; } } });
      });
  cur = n; document.getElementById('count').textContent = (n + 1) + ' / ' + SLIDES.length;
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i === n));
  document.getElementById('notes').innerHTML = '<b>SPEAKER NOTES · SLIDE ' + (n + 1) + '</b>' + (SLIDES[n].note || '');
  try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) {}
  wake();
}
document.getElementById('prev').onclick = e => { e.stopPropagation(); go(cur - 1); };
document.getElementById('next').onclick = e => { e.stopPropagation(); go(cur + 1); };
document.getElementById('nbtn').onclick = e => { e.stopPropagation(); document.getElementById('notes').classList.toggle('show'); };
document.getElementById('notes').onclick = e => e.stopPropagation();
if (!/[?&]notes/.test(location.search)) { document.getElementById('nbtn').style.display = 'none'; window.NONOTES = 1; }
const fsb = document.getElementById('fs'), de = document.documentElement;
if (!(de.requestFullscreen || de.webkitRequestFullscreen) || matchMedia('(display-mode: standalone)').matches || navigator.standalone) fsb.style.display = 'none';
fsb.onclick = e => { e.stopPropagation(); const f = de.requestFullscreen || de.webkitRequestFullscreen; if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else f.call(de); };
document.getElementById('wrap').addEventListener('click', e => { if (e.clientX > innerWidth * 0.35) go(cur + 1); else go(cur - 1); });
addEventListener('keydown', e => { if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); } if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); } if (e.key === 'n' && !window.NONOTES) document.getElementById('notes').classList.toggle('show'); });
let sx = null, sy = 0; addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { go(cur + (dx < 0 ? 1 : -1)); e.preventDefault(); } sx = null; });
let ht; function wake() { const b = document.getElementById('bar'); b.classList.remove('hide'); clearTimeout(ht); ht = setTimeout(() => { if (!document.getElementById('notes').classList.contains('show')) b.classList.add('hide'); }, 3500); }
function kick() { SLIDES[cur].el.querySelectorAll('video').forEach(v => { if (!v.dataset.sound && v.paused) { const p = v.play(); if (p) p.catch(() => {}); } }); }
addEventListener('touchend', kick, { passive: true }); addEventListener('click', kick, true);
setInterval(kick, 1500);
addEventListener('mousemove', wake); addEventListener('touchstart', wake, { passive: true });
setTimeout(() => document.getElementById('hint').style.opacity = 0, 4000);
// first-load: fetch everything so it plays smoothly and keeps working offline
const ASSETS = ["./", "index.html", "manifest.json", "icon.png", "logo.png", "s/p-01.jpg", "s/p-02.jpg", "s/p-03.jpg", "s/p-04.jpg", "s/p-05.jpg", "s/p-06.jpg", "s/p-07.jpg", "s/p-08.jpg", "s/p-09.jpg", "s/p-10.jpg", "s/p-11.jpg", "s/p-12.jpg", "s/p-13.jpg", "s/ov-01.png", "v/how.mp4", "v/reel.mp4", "v/room.mp4", "v/s01.mp4", "v/s02.mp4", "v/s03.mp4", "v/s04.mp4", "v/s05.mp4", "v/s06.mp4", "v/s07.mp4", "v/s08.mp4", "v/s09.mp4", "v/s10.mp4", "v/s11.mp4", "v/s12.mp4", "v/s13.mp4", "v/s14.mp4", "v/s15.mp4", "v/s16.mp4", "v/s17b.mp4", "v/s18.mp4", "v/s19.mp4", "v/reel.jpg", "sw.js"];
(async () => {
  if ('serviceWorker' in navigator) { try { await navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  let done = 0; const lp = document.getElementById('lp'), lt = document.getElementById('lt');
  const files = ASSETS.filter(a => a !== './');
  const cache = ('caches' in window) ? await caches.open('pt-v4').catch(() => null) : null;
  await Promise.all(files.map(async u => { try { if (cache) { const hit = await cache.match(u); if (!hit) await cache.add(u); } else await fetch(u); } catch (e) {} done++; lp.style.width = (100 * done / files.length) + '%'; lt.textContent = done + ' of ' + files.length; }));
  document.getElementById('load').remove();
  const h = parseInt(location.hash.slice(1)); go(isNaN(h) ? 0 : h - 1);
})();
</script></body></html>
