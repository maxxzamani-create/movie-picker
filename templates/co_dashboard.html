<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Override — Business Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  :root {
    --bg: #0b0e13; --surface: #131822; --surface2: #1a2130;
    --line: #232c3f; --text: #e8ecf4; --dim: #8b96ab;
    --gold: #f2a900; --green: #2ecc71; --red: #e74c3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 14px;
           padding: 14px 22px; border-bottom: 1px solid var(--line); }
  header .mark { width: 34px; height: 34px; border-radius: 8px;
                 background: linear-gradient(135deg, var(--gold), #b87400);
                 display: grid; place-items: center; font-weight: 800; color: #14100a; }
  header h1 { font-size: 17px; letter-spacing: 2px; }
  header nav { margin-left: auto; }
  header a { color: var(--dim); text-decoration: none; font-size: 13px;
             padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; }
  header a:hover { color: var(--text); border-color: var(--gold); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 22px;
          display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line);
          border-radius: 14px; padding: 18px 20px; }
  .card h2 { font-size: 11px; letter-spacing: 2px; color: var(--dim);
             margin-bottom: 14px; font-weight: 700; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .row2 { grid-template-columns: 1fr; } }

  input[type=text] { background: var(--surface2); border: 1px solid var(--line);
        color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 14px;
        width: 100%; }
  input[type=file] { color: var(--dim); font-size: 13px; }
  .btn { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line);
         background: var(--surface2); color: var(--text); font-size: 13px;
         cursor: pointer; }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: var(--gold); color: #14100a; font-weight: 700;
                 border-color: var(--gold); }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .switch { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .switch input { width: 40px; height: 21px; accent-color: var(--gold); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
          gap: 14px; }
  .ad { background: var(--surface2); border: 1px solid var(--line);
        border-radius: 11px; overflow: hidden; }
  .ad.off { opacity: .45; }
  .ad video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
  .ad .body { padding: 10px 12px; }
  .ad .name { font-size: 13.5px; font-weight: 600; margin-bottom: 8px; }
  .ad .ctl { display: flex; align-items: center; gap: 8px; font-size: 12px;
             color: var(--dim); }
  .ad .ctl button { margin-left: auto; }
  .pill { font-size: 10px; font-weight: 700; letter-spacing: 1px;
          padding: 2px 8px; border-radius: 5px; background: var(--surface);
          color: var(--dim); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
           margin-bottom: 16px; }
  .stat { background: var(--surface2); border-radius: 10px; padding: 14px;
          text-align: center; }
  .stat b { display: block; font-size: 26px; color: var(--gold); }
  .stat span { font-size: 11px; color: var(--dim); letter-spacing: .5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-size: 11px; letter-spacing: 1px;
       padding: 7px 9px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 9px; border-bottom: 1px solid var(--surface2); }
  .muted { color: var(--dim); }
  #msg { font-size: 13px; margin-top: 9px; min-height: 17px; }
  #msg.err { color: var(--red); } #msg.ok { color: var(--green); }
</style>
</head>
<body>
<header>
  <div class="mark">CO</div>
  <h1>BUSINESS DASHBOARD</h1>
  <nav><a href="/co/">← Watch the TV</a></nav>
</header>

<div class="wrap">
  <div class="row2">
    <div class="card">
      <h2>BUSINESS SETTINGS</h2>
      <div style="display:flex; gap:10px; margin-bottom:14px">
        <input type="text" id="bizName" placeholder="Business name">
        <button class="btn" id="saveName">Save</button>
      </div>
      <label class="switch">
        <input type="checkbox" id="overrideToggle">
        <span>Commercial override <b>enabled</b> — swap breaks for my promos</span>
      </label>
    </div>
    <div class="card">
      <h2>UPLOAD A PROMO SPOT</h2>
      <form id="uploadForm">
        <div style="display:flex; flex-direction:column; gap:10px">
          <input type="text" id="adName" placeholder="Spot name (e.g. Weekend Brunch Special)">
          <div style="display:flex; gap:10px; align-items:center">
            <input type="file" id="adFile" accept=".mp4,.webm,.mov,.m4v">
            <button class="btn primary" type="submit">Upload</button>
          </div>
        </div>
      </form>
      <div id="msg"></div>
    </div>
  </div>

  <div class="card">
    <h2>AD LIBRARY <span class="muted" style="letter-spacing:0">— spots rotate during detected breaks</span></h2>
    <div class="grid" id="adGrid"></div>
  </div>

  <div class="card">
    <h2>PERFORMANCE</h2>
    <div class="stats">
      <div class="stat"><b id="stPlays">0</b><span>TOTAL PLAYS</span></div>
      <div class="stat"><b id="stAirtime">0s</b><span>TOTAL AIRTIME</span></div>
      <div class="stat"><b id="stSpots">0</b><span>ACTIVE SPOTS</span></div>
    </div>
    <div class="row2">
      <div>
        <h2>BY SPOT</h2>
        <table id="perAdTable">
          <thead><tr><th>SPOT</th><th>PLAYS</th><th>AIRTIME</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div>
        <h2>RECENT PLAYS</h2>
        <table id="recentTable">
          <thead><tr><th>WHEN</th><th>SPOT</th><th>SECONDS</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <button class="btn danger" id="clearBtn" style="margin-top:14px">Clear impression log</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = null;

async function load() {
  state = await (await fetch("/co/api/state")).json();
  $("bizName").value = state.business_name;
  $("overrideToggle").checked = state.override_enabled;
  renderAds();
  await loadStats();
}

function renderAds() {
  const g = $("adGrid"); g.innerHTML = "";
  for (const ad of state.ads) {
    const div = document.createElement("div");
    div.className = "ad" + (ad.enabled ? "" : " off");
    div.innerHTML = `
      <video preload="metadata" muted controls>
        <source src="${ad.url}" type="video/mp4">
        ${ad.url_webm ? `<source src="${ad.url_webm}" type="video/webm">` : ""}
      </video>
      <div class="body">
        <div class="name">${esc(ad.name)}</div>
        <div class="ctl">
          <label class="switch" style="gap:6px">
            <input type="checkbox" ${ad.enabled ? "checked" : ""}
                   onchange="toggleAd('${ad.id}')"> on air
          </label>
          ${ad.builtin
            ? '<span class="pill" style="margin-left:auto">DEMO</span>'
            : `<button class="btn danger" onclick="deleteAd('${ad.id}')">Delete</button>`}
        </div>
      </div>`;
    g.appendChild(div);
  }
  $("stSpots").textContent = state.ads.filter(a => a.enabled).length;
}

async function loadStats() {
  const s = await (await fetch("/co/api/impressions")).json();
  $("stPlays").textContent = s.total_plays;
  $("stAirtime").textContent = Math.round(s.total_seconds) + "s";
  const pa = $("perAdTable").querySelector("tbody"); pa.innerHTML = "";
  for (const [, v] of Object.entries(s.per_ad)) {
    pa.innerHTML += `<tr><td>${esc(v.ad_name)}</td><td>${v.plays}</td>
                     <td>${Math.round(v.seconds)}s</td></tr>`;
  }
  if (!Object.keys(s.per_ad).length)
    pa.innerHTML = '<tr><td colspan="3" class="muted">No plays yet — go watch the TV and let a break hit.</td></tr>';
  const rc = $("recentTable").querySelector("tbody"); rc.innerHTML = "";
  for (const imp of s.recent) {
    rc.innerHTML += `<tr><td class="muted">${imp.at.replace("T", " ").replace("+00:00", "")}</td>
                     <td>${esc(imp.ad_name)}</td><td>${imp.seconds}s</td></tr>`;
  }
  if (!s.recent.length)
    rc.innerHTML = '<tr><td colspan="3" class="muted">—</td></tr>';
}

window.toggleAd = async id => {
  await fetch(`/co/api/ads/${id}/toggle`, {method: "POST"});
  await load();
};
window.deleteAd = async id => {
  if (!confirm("Delete this spot?")) return;
  await fetch(`/co/api/ads/${id}`, {method: "DELETE"});
  await load();
};

$("saveName").addEventListener("click", async () => {
  await fetch("/co/api/settings", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({business_name: $("bizName").value}),
  });
  flash("Saved.", "ok");
});

$("overrideToggle").addEventListener("change", async e => {
  await fetch("/co/api/settings", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({override_enabled: e.target.checked}),
  });
});

$("uploadForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = $("adFile").files[0];
  if (!f) return flash("Choose a video file first.", "err");
  const fd = new FormData();
  fd.append("file", f);
  fd.append("name", $("adName").value);
  flash("Uploading…", "");
  const res = await fetch("/co/api/ads", {method: "POST", body: fd});
  const out = await res.json();
  if (out.error) return flash(out.error, "err");
  $("adName").value = ""; $("adFile").value = "";
  flash("Uploaded — it's in the rotation.", "ok");
  await load();
});

$("clearBtn").addEventListener("click", async () => {
  if (!confirm("Clear all impression history?")) return;
  await fetch("/co/api/impressions/clear", {method: "POST"});
  await loadStats();
});

function flash(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls; }
const esc = s => s.replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

load();
setInterval(loadStats, 5000);
</script>
</body>
</html>
