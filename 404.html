  *{margin:0;padding:0;box-sizing:border-box}

  #sharkySvg .shark{transform-box:fill-box;transform-origin:center;animation:swim 5.2s ease-in-out infinite}
  @keyframes swim{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-1.4deg)}}
  #sharkySvg .fin-tail{transform-box:fill-box;transform-origin:0% 55%;animation:tail 2.1s ease-in-out infinite}
  @keyframes tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
  #sharkySvg .fin-pec{transform-box:fill-box;transform-origin:50% 0%;animation:pec 2.6s ease-in-out infinite}
  @keyframes pec{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(6deg)}}
  #sharkySvg .eye-lid{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
  @keyframes blink{0%,93.5%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}97.5%{transform:scaleY(0)}}
  #sharkySvg .bub{animation:bubrise 4.2s ease-in infinite}
  #sharkySvg .b2{animation-delay:1.3s}#sharkySvg .b3{animation-delay:2.5s}
  @keyframes bubrise{0%{transform:translateY(6px);opacity:0}18%{opacity:.75}80%{opacity:.5}100%{transform:translateY(-34px);opacity:0}}
  .code{font-family:"Bebas Neue",sans-serif;font-size:clamp(4rem,14vw,7.5rem);line-height:1;letter-spacing:.04em;
    background:linear-gradient(120deg,var(--blue-pale),var(--blue-deep));-webkit-background-clip:text;background-clip:text;color:transparent}

  .btn{display:inline-block;padding:13px 26px;border-radius:12px;text-decoration:none;font-weight:800;font-size:.95rem;

  .btn:hover{transform:translateY(-2px);border-color:var(--blue)}
  .btn.primary{background:linear-gradient(120deg,var(--blue-pale),var(--blue-deep));color:#04101f;border-color:transparent}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
